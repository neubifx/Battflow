
name: tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Battflow
      run: |
        python -m pip install ".[test]"

    - name: Check CLI
      run: |
        battflow --help

    - name: Diagnose ACPYPE library environment
      run: |
        python - <<'PY'
        import os
        import ssl
        import subprocess
        import sys

        print("OpenSSL:", ssl.OPENSSL_VERSION)
        print("Before import:", os.environ.get("LD_LIBRARY_PATH"))

        import acpype
        print("After importing acpype:", os.environ.get("LD_LIBRARY_PATH"))

        import battflow.md_setup
        print("After importing md_setup:", os.environ.get("LD_LIBRARY_PATH"))

        result = subprocess.run(
            [sys.executable, "-c", "import ssl; print(ssl.OPENSSL_VERSION)"],
            capture_output=True,
            text=True
        )

        print("Subprocess return code:", result.returncode)
        print("Subprocess stdout:", result.stdout)
        print("Subprocess stderr:", result.stderr)
        PY

    - name: Run tests
      run: |
        python -m pytest

